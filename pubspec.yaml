name: lookup
description: "LookUp — a push-only 'step outside right now' app. ISS overhead in 8 minutes, aurora possible tonight, a Starlink train in 4."
publish_to: 'none'
version: 0.1.0+1

environment:
  sdk: ^3.13.5

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter

  # State
  flutter_riverpod: ^3.4.3

  # Orbital mechanics: SGP4/SDP4, look angles, pass + naked-eye visibility
  satellite_observer: ^1.0.1

  # Data
  http: ^1.6.0
  shared_preferences: ^2.5.6

  # Device
  geolocator: ^14.1.2
  flutter_local_notifications: ^22.3.2
  timezone: ^0.11.2
  flutter_timezone: ^5.0.1
  workmanager: ^0.10.10
  share_plus: ^13.3.1
  in_app_purchase: ^3.3.1
  flutter_rotation_sensor: ^0.4.0
  path_provider: ^2.1.6
  home_widget: ^0.10.0
  intl: any
  camera: ^0.12.1
  add_2_calendar: ^3.1.1
  image_picker: ^1.2.4
  url_launcher: ^6.3.3

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  flutter_launcher_icons: ^0.14.4
  shared_preferences_platform_interface: ^2.4.2

flutter:
  uses-material-design: true
  assets:
    - assets/sky/stars.json
    - assets/sky/constellations.json
    - assets/sky/proper_motion.json
    - assets/sky/skyglow.bin.gz
    - assets/sky/places.json
  fonts:
    # Inter (OFL): one family for everything, variable wght + opsz.
    - family: Inter
      fonts:
        - asset: assets/fonts/InterVariable.ttf

flutter_launcher_icons:
  android: true
  ios: true
  image_path: assets/icon/icon.png
  adaptive_icon_background: "#000000"
  adaptive_icon_foreground: assets/icon/icon_foreground.png
  remove_alpha_ios: true
