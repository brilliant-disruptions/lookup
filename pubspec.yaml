name: lookup
description: "LookUp — a push-only 'step outside right now' app. ISS overhead in 8 minutes, aurora possible tonight, a Starlink train in 4."
publish_to: 'none'
version: 0.1.0+1

environment:
  sdk: ^3.13.5

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter

  # State
  flutter_riverpod: ^3.4.3

  # Orbital mechanics: SGP4/SDP4, look angles, pass + naked-eye visibility
  satellite_observer: ^1.0.1

  # Data
  http: ^1.6.0
  shared_preferences: ^2.5.6

  # Device
  geolocator: ^14.1.2
  flutter_local_notifications: ^22.3.2
  timezone: ^0.11.2
  flutter_timezone: ^5.0.1
  workmanager: ^0.10.10
  share_plus: ^13.3.1
  intl: any

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
