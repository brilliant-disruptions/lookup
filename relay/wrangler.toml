# LookUp relay: Seen near you (docs/seen-near-you.md) and "Look up with me"
# invite links. Deploy steps: README.md.
name = "lookup-relay"
main = "src/index.ts"
compatibility_date = "2025-10-01"
# node-forge (Wallet pass signing) looks for Node's crypto module.
compatibility_flags = ["nodejs_compat"]

[[d1_databases]]
binding = "DB"
database_name = "lookup-relay"
# `wrangler d1 create lookup-relay` prints this; paste it here.
database_id = "4d1f3163-37ac-48aa-8abc-c5b485e83a79"

[triggers]
crons = ["*/10 * * * *"]

[observability]
enabled = true

# Errors and our own log lines only. The per-request log would keep each
# caller's address and the cells they asked about, and the privacy page says
# the relay keeps neither.
[observability.logs]
invocation_logs = false
