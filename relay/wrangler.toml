# Seen near you relay (docs/seen-near-you.md). Deploy steps: README.md.
name = "lookup-relay"
main = "src/index.ts"
compatibility_date = "2025-10-01"

[[d1_databases]]
binding = "DB"
database_name = "lookup-relay"
# `wrangler d1 create lookup-relay` prints this; paste it here.
database_id = "REPLACE_WITH_D1_DATABASE_ID"

[triggers]
crons = ["*/10 * * * *"]

[observability]
enabled = true
