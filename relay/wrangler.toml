# LookUp relay: Seen near you (docs/seen-near-you.md) and "Look up with me"
# invite links. Deploy steps: README.md.
name = "lookup-relay"
main = "src/index.ts"
compatibility_date = "2025-10-01"
# node-forge (Wallet pass signing) looks for Node's crypto module.
compatibility_flags = ["nodejs_compat"]

[[d1_databases]]
binding = "DB"
database_name = "lookup-relay"
# `wrangler d1 create lookup-relay` prints this; paste it here.
database_id = "REPLACE_WITH_D1_DATABASE_ID"

[triggers]
crons = ["*/10 * * * *"]

[observability]
enabled = true
